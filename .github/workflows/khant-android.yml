
name: KHANT VPN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Install dependencies
        run: make android-apk-install-deps

      - name: Prepare Android build
        run: make android-apk-prepare CHANNEL=dev

      - name: Generate KHANT VPN Splash Screen
        run: dart run flutter_native_splash:create

      - name: Build KHANT VPN APK
        run: make android-apk-release CHANNEL=dev

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KHANT-VPN-Android-APK
          path: build/app/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 7
